<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conference Minutes · M.M. Mokone Annual Conference 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--purple:#1a0a2e;--purple2:#3a1750;--gold:#C4972A;--goldsoft:#e8c97a;--bg:#f4f1f8;--paper:#fff;--ink:#1d1526;--muted:#665c75;--line:#ddd5e8;
  --accent:#4b1d6e;--accent-soft:#eee4f6;--pend:#8a5200;--pend-bg:#fcefd4;--ok:#1c6642;--ok-bg:#dcf2e5;--no:#9c2a2a;--no-bg:#fae2df;
  --doc:Georgia,"Times New Roman",serif;--ui:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--head:"Playfair Display",Georgia,serif}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:16px;padding-right:16px}
.hero{background:linear-gradient(160deg,var(--purple) 0%,var(--purple2) 55%,var(--purple) 100%);color:#fff;border-bottom:3px solid var(--gold)}
.hero .wrap{padding-top:16px;padding-bottom:14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--goldsoft)}
h1{font-family:var(--head);font-weight:700;font-size:clamp(20px,5vw,26px);line-height:1.2;margin:3px 0 0;text-wrap:balance}
.hero .sec{font-size:12.5px;color:#d4b8f0;text-align:right}
.hero .sec button{background:none;border:0;padding:0;color:var(--goldsoft);text-decoration:underline;font-weight:600}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 11px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:5px;border-radius:10px;background:var(--pend-bg);color:var(--pend);font-size:12px;text-align:center}
.count.ok{background:var(--ok-bg);color:var(--ok)}
main.wrap{padding-top:16px;padding-bottom:90px;display:flex;flex-direction:column;gap:14px}
.notice{font-size:13.5px;color:var(--muted);border-left:3px solid var(--gold);padding:2px 0 2px 12px}
.notice b{color:var(--ink)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:4px 11px;font-size:13px}
details.check{background:var(--pend-bg);border-radius:8px;padding:9px 12px;font-size:13.5px}
details.check summary{font-weight:700;color:var(--pend);cursor:pointer}
details.check ul{margin:8px 0 2px;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.book{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px clamp(12px,3.5vw,34px) 18px}
.blk{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 10px;padding:13px 0;border-bottom:1px solid var(--line);scroll-margin-top:60px}
.blk:last-child{border-bottom:0}
.ref{font-family:var(--head);font-weight:700;color:var(--accent);font-size:16px;padding-top:2px;font-variant-numeric:tabular-nums}
.body{min-width:0;display:flex;flex-direction:column;gap:8px}
.body p{font-family:var(--doc);font-size:17px;line-height:1.6;margin:0;max-width:66ch;overflow-wrap:anywhere}
.blk.head .body p{font-family:var(--head);font-weight:700;font-size:20px;line-height:1.25}
.blk.head{border-bottom:2px solid var(--purple2)}
.blk.church h3{font-family:var(--head);font-size:17.5px;font-weight:700;margin:0}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:100%}
th,td{padding:4px 12px 4px 0;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:130px}
th:last-child,td:last-child{padding-right:0}
table.pasted td{text-align:left;white-space:normal;border-bottom:1px solid var(--line);vertical-align:top;min-width:0}
table.pasted td:nth-child(even){text-align:right;white-space:nowrap;font-weight:600}
table.pasted tr:first-child td{font-weight:700;color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
thead th{font-weight:700;color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.meta{font-size:13.5px;color:var(--muted)}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.propose{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--accent)}
.propose:hover{background:var(--accent-soft)}
.pill{display:inline-block;border-radius:4px;padding:1px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.pending{background:var(--pend-bg);color:var(--pend)}
.pill.accepted{background:var(--ok-bg);color:var(--ok)}
.pill.declined{background:var(--no-bg);color:var(--no)}
.flag{font-size:13px;color:var(--pend);font-weight:600}
.waiting{display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--pend);padding-left:10px;font-size:13.5px}
.who{color:var(--muted);font-size:13px}
del{background:var(--no-bg);color:var(--no);text-decoration:line-through}
ins{background:var(--ok-bg);color:var(--ok);text-decoration:none;font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.card header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;justify-content:space-between}
.card h3{margin:0;font-size:15px;font-weight:700}
.card .change{font-family:var(--doc);font-size:16.5px;line-height:1.5;overflow-wrap:anywhere;max-height:260px;overflow-y:auto}
.card .why{font-size:13.5px}
.daycard{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
.daycard h3{font-family:var(--head);font-size:18px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 14px;font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);display:inline-block}
.btn.go{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.yes{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.nope{color:var(--no)}
.btn[disabled]{opacity:.55;cursor:default}
.stack{display:flex;flex-direction:column;gap:6px}
label{font-size:13px;font-weight:700}
label small{font-weight:400;color:var(--muted)}
input[type=text],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:9px 10px}
textarea{min-height:120px;font-family:var(--doc);font-size:16px;line-height:1.45;resize:vertical}
textarea.big{min-height:300px;font-size:14px}
.empty{color:var(--muted);padding:26px 0;text-align:center}
.sched ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-family:var(--doc);font-size:17px;line-height:1.5}
.overlay{position:fixed;inset:0;background:rgba(26,10,46,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:min(640px,100%);max-height:92%;overflow-y:auto;border-radius:14px 14px 0 0;padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--head);font-size:21px;margin:0}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.err{color:var(--no);font-size:13.5px;font-weight:700}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--purple);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:15;max-width:calc(100% - 32px)}
@media (max-width:520px){.blk{grid-template-columns:minmax(0,1fr)}.ref:empty{display:none}table{font-size:12.5px}th,td{padding-right:8px}th:first-child,td:first-child{min-width:92px}}
</style>
</head>
<body>
<div class="hero"><div class="wrap">
  <div><a class="eyebrow" href="42nd.html" style="text-decoration:none;display:block">‹ The 42nd Session · M.M. Mokone Memorial Annual Conference</a><h1 id="title">Conference Minutes</h1></div>
  <div class="sec" id="secbox"></div>
</div></div>
<div class="bar" id="bar" hidden><div class="wrap"><div class="tabs" role="tablist" id="tabs"></div></div></div>
<main class="wrap" id="main"><div class="empty">Loading the minutes…</div></main>
<div id="layer"></div>

<script>
/* ====== SETTINGS ====== */
var MINUTES_URL = "https://script.google.com/macros/s/AKfycbzEWYVxcN3-eSBgCr76LIH3LoxZw9LyM6DP34rpScuF4L8eiVRV_Jw8TQbQ_5bIgd76/exec";   // the web app URL of the minutes Apps Script
/* ====================== */

var F = {name:'Church name', m25:'Membership, last year', m26:'Membership, this year',
  acA:'Annual Conference Budget, assessed', acP:'Annual Conference Budget, paid', acO:'Annual Conference Budget, outstanding',
  erA:'Episcopal Residence Project, assessed', erP:'Episcopal Residence Project, paid', erO:'Episcopal Residence Project, outstanding',
  funds:'Total funds raised by the church'};
var ROLES = ['Delegate','Pastor','Presiding Elder','Conference Officer','Episcopal Officer','Bishop'];
var ui = {view:'home', tab:'minutes', filter:'pending', form:null, editing:null, declining:null, removing:null, busy:false, preview:null};
var days = [], D = null, reports = null;
var sec = {pin:'', name:''}, me = {name:'', role:'Delegate', church:''};
try { sec = JSON.parse(sessionStorage.getItem('mm-sec')) || sec; } catch(e){}
try { me = Object.assign(me, JSON.parse(localStorage.getItem('mm-me') || '{}')); } catch(e){}
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var words = function(s){ return String(s).trim().split(/\s+/).filter(Boolean); };

function getJSON(url, tries){ tries = tries || 4; var n = 0;
  function once(){ n++; var ctl = window.AbortController ? new AbortController() : null, timer = ctl ? setTimeout(function(){ ctl.abort(); }, 25000) : null;
    return fetch(url, ctl ? {signal:ctl.signal} : undefined).then(function(r){ return r.text(); }).then(function(t){ if(timer) clearTimeout(timer); return JSON.parse(t); })
      .catch(function(e){ if(timer) clearTimeout(timer); if(n >= tries) throw e; return new Promise(function(res){ setTimeout(res, 1200*n + Math.random()*800); }).then(once); }); }
  return once(); }
function api(params){ var q = Object.keys(params).map(function(k){ return k+'='+encodeURIComponent(params[k]); }).join('&');
  return getJSON(MINUTES_URL+'?'+q); }
function send(body){ return fetch(MINUTES_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)})
  .then(function(r){ return r.json(); })
  .then(function(r){ if(r && r.badPin){ sec={pin:'',name:''}; try{sessionStorage.removeItem('mm-sec');}catch(e){} } return r; }); }

/* ---------- reading pasted minutes ---------- */
function parseMinutes(raw){
  var L = [];
  String(raw).replace(/\r/g,'').split('\n').forEach(function(l){
    var s = l.replace(/ /g,' ').replace(/^[ ﻿]+|[ ]+$/g,'');
    if(!/\S/.test(s) || /P\s?a\s?g\s?e/.test(s) && s.trim().length<16 || /^\s*_+-?\s*$/.test(s)) return;
    var t = s.trim();
    if(/^Item(\t|\s{2,})/.test(t) || /^Section [A-Z]\b/.test(t) || /^OTHER FINANCIAL/i.test(t)) return;
    L.push(s);
  });
  var M = [];
  for(var i=0;i<L.length;i++){ var s=L[i];
    if(/^\s*Total Funds Raised/i.test(s) && !/R\s?\d/.test(s) && i+1<L.length){ s += ' ' + L[++i].trim(); }
    M.push(s); }
  L = M;
  var cells = function(s){ return s.split(/\t+|\s{2,}/).map(function(c){ return c.trim(); }).filter(function(c){ return c!==''; }); };
  var isRow = function(s){ return /^(Total Membership|Annual Conference|Episcopal Residence|Total Funds)/i.test(s); };
  var NUM = /^(\d{1,3}(?:\.\d{1,3})*)(?:\.\s*|\s+)(?=[^\d\s])(\S.*)$/;
  var isNum = function(s){ return NUM.test(s) && !/^\d+\s?(years|th|st|nd|rd)\b/i.test(s) && !/^[1-3]\s+(Samuel|Kings|Chronicles|Corinthians|Thessalonians|Timothy|Peter|John)\b/.test(s); };
  var ends = function(s){ return /[.:!?"”’)]$/.test(s); };
  var blocks = [], cur = null, district = '', dnum = '', topN = 0, sub = false, lastSub = 0, prevEnd = true, sec = '', lastRef = '', carried = false, subBase = '';
  var push = function(b){ if(sec) b.sec = sec; blocks.push(b); return b; };
  for(i=0;i<L.length;i++){
    var rawLine = L[i]; s = rawLine.trim(); var nxt = (L[i+1] || '').trim();
    if(/^Total Membership/i.test(nxt) && !isRow(s)){
      var c = {kind:'church', district:district, ref:dnum, name:s.replace(/\.$/,''), m25:'', m26:'', acA:'', acP:'', acO:'', erA:'', erP:'', erO:'', funds:''};
      i++;
      while(i<L.length && isRow(L[i].trim())){ var ln = L[i].trim(), p = cells(ln);
        if(/^Total Membership/i.test(p[0])){ c.m25=p[1]||''; c.m26=p[2]||''; }
        else if(/^Annual/i.test(p[0])){ c.acA=p[1]||''; c.acP=p[2]||''; c.acO=p[3]||''; }
        else if(/^Episcopal/i.test(p[0])){ c.erA=p[1]||''; c.erP=p[2]||''; c.erO=p[3]||''; }
        else { c.funds = p.length>1 ? p.slice(1).join(' ') : ln.replace(/^.*Church\s*/i,''); }
        i++; }
      i--; push(c); cur = null; prevEnd = true; carried = false; continue;
    }
    var m = s.match(/^(\d+(?:\.\d+)?)\.?\s*(\S.*\bDistrict)\.?$/);
    if(m && s.length<60){ dnum = m[1]; district = m[2].trim(); if(m[1].indexOf('.')<0){ topN = parseInt(m[1],10); sub=false; lastSub=0; }
      push({kind:'district', ref:dnum, text:s.replace(/\s+/g,' ')}); lastRef = dnum; cur=null; prevEnd=true; carried=false; continue; }
    if(/^(MORNING|AFTERNOON|EVENING|NIGHT|BUSINESS|OPENING|CLOSING)\s+SESSION\b/i.test(s) && s.length<60){
      sec = s.replace(/\s*\d{1,2}[:h]\d{2}.*$/,'').toLowerCase().replace(/\b[a-z]/g,function(x){ return x.toUpperCase(); });
      if(/^BUSINESS|^OPENING|^CLOSING/i.test(s)){ topN = 0; sub = false; lastSub = 0; }
      push({kind:'session', ref:'', text:s}); cur=null; prevEnd=true; carried=false; lastRef=''; continue; }
    if((/^DAY\s/i.test(s) || /^MINUTES\s+OF\b/i.test(s) || /^HELD\s+AT\b/i.test(s)) && s.length<110 && blocks.length<4){ blocks.push({kind:'session', ref:'', text:s}); cur=null; prevEnd=true; continue; }
    if(isNum(s)){
      m = s.match(NUM); var num = m[1], ref = num;
      if(num.indexOf('.')<0){ var v = parseInt(num,10), dotted = false;
        for(var k=i+1;k<L.length;k++){ var nx = L[k].trim(); if(isNum(nx)){ dotted = nx.indexOf(v+'.')===0 && /^\d+\.\d/.test(nx); break; } if(/^\d+\.\d+\s*\S.*District\.?$/.test(nx)){ dotted = nx.indexOf(v+'.')===0; break; } }
        if(sub && v>lastSub && v<=lastSub+3 && !(v===topN+1 && (dotted || v!==lastSub+1))){ lastSub=v; ref=subBase+'.'+v; }
        else if(sub && v===1 && lastSub>=1){ lastSub=1; ref=subBase+'.1'; }
        else if(!sub && topN>0 && (v===1 || (v>1 && v<topN))){ sub=true; lastSub=v; subBase=(lastRef.indexOf(topN+'.')===0 && v===1) ? lastRef : String(topN); ref=subBase+'.'+v; }
        else { topN=v; sub=false; lastSub=0; } }
      cur = push({kind:'text', ref:ref, text:m[2].replace(/^[.\s]+/,'')}); lastRef = ref; prevEnd = ends(s); carried = /carried\.?$/i.test(s); continue;
    }
    if(/^[❖•▪■*]\s*/.test(s) && s.length>3){ cur = push({kind:'text', ref:'Note', text:s.replace(/^[❖•▪■*]\s*/,'')}); prevEnd=ends(s); carried=/carried\.?$/i.test(s); continue; }
    if(/^(Statement|Word) of commendation/i.test(s)){ cur = push({kind:'text', ref:dnum+' Commendation', text:s}); prevEnd=ends(s); carried=false; continue; }
    var isTable = rawLine.indexOf('\t')>=0 || (s.split(' | ').length>=2);
    if(isTable){
      var row = (rawLine.indexOf('\t')>=0 ? rawLine.split('\t') : s.split(' | ')).map(function(x){ return x.trim(); }).join(' | ');
      if(cur && cur.table) cur.text += '\n' + row; else { cur = push({kind:'text', ref:'', table:true, text:row}); if(lastRef) cur.cont = lastRef; }
      prevEnd = true; carried = false; continue;
    }
    if(!cur || cur.table || carried){ cur = push({kind:'text', ref:'', text:s}); if(lastRef) cur.cont = lastRef; }
    else cur.text += (prevEnd ? '\n\n' : ' ') + s;
    prevEnd = ends(s); carried = /carried\.?$/i.test(s);
  }
  blocks.forEach(function(b,k){ b.id = 'b'+(k+1); });
  return blocks;
}

/* ---------- helpers ---------- */
function num(s){ s=String(s).replace(/[R\s]/g,''); if(/,\d{2}$/.test(s)) s=s.replace(/,(\d{2})$/,'.$1'); s=s.replace(/,/g,''); var m=s.match(/^\d+(\.\d+)?/); return m?parseFloat(m[0]):NaN; }
function flags(c){ var out=[]; [['ac','Annual Conference Budget']].forEach(function(x){
  var a=num(c[x[0]+'A']),p=num(c[x[0]+'P']),o=num(c[x[0]+'O']); if(isNaN(a)||isNaN(p)||isNaN(o)) return;
  if(Math.abs(Math.max(a-p,0)-o)>=1) out.push(x[1]); }); return out; }
var normName = function(s){ return String(s).toLowerCase().replace(/a\.?m\.?e\.?/g,'').replace(/church|memorial|chapel|cathedral|temple/g,'').replace(/\bmount\b/g,'mt').replace(/[^a-z0-9]/g,''); };
var distKey = function(s){ return (String(s).toLowerCase().match(/[a-z]+/)||[''])[0]; };
function reportFor(b){ if(!reports) return null; var n=normName(b.name), d=distKey(b.district), hit=null, any=null, cnt=0;
  reports.forEach(function(r){ if(normName(r.Church)!==n) return; if(distKey(r.District)===d) hit=r; any=r; });
  if(hit) return hit; reports.forEach(function(r){ if(normName(r.Church)===n && distKey(r.District)!==distKey((any||{}).District)) cnt++; }); return cnt?null:any; }
function reportDiffs(b){ var r=reportFor(b); if(!r) return [];
  var map={m25:'Total Prev',m26:'Total Curr',acA:'ACB Assessed',acP:'ACB Paid',erA:'ERP Assessed',erP:'ERP Paid',erO:'ERP Outstanding',funds:'Funds Raised'}, out=[];
  Object.keys(map).forEach(function(k){ var a=num(b[k]), v=num(r[map[k]]); if(isNaN(a)||isNaN(v)) return; if(Math.abs(a-v)>=1) out.push(F[k]+': minutes say '+b[k]+', the report says '+r[map[k]]); });
  return out; }
var blockOf = function(id){ return D.blocks.filter(function(b){ return b.id===id; })[0]; };
var order = function(id){ for(var i=0;i<D.blocks.length;i++) if(D.blocks[i].id===id) return i; return 1e9; };
function label(b){ if(!b) return 'Removed item';
  if(b.kind==='church') return (b.ref?'Item '+b.ref+', ':'')+b.name;
  if(b.added) return 'Added item'; if(b.table) return 'Table'+(b.cont?' under item '+b.cont:''); if(!b.ref) return b.cont ? 'Item '+b.cont+', continued' : (b.kind==='session'||String(b.text).length<90 ? 'Heading' : 'Paragraph'); if(b.ref==='Note') return 'Note';
  if(/Commendation/.test(b.ref)) return 'Item '+b.ref.replace(' Commendation','')+', commendation';
  return 'Item '+b.ref; }
function where(b){ var l=label(b); if(!b) return l; var sc = b.sec ? ', '+b.sec : '';
  if(b.kind==='church' || (b.ref && b.ref!=='Note' && !/Commendation/.test(b.ref))) return l+sc;
  var w=words(String(b.text).replace(/\|/g,' ')); return l+sc+' (“'+w.slice(0,6).join(' ')+(w.length>6?'…':'')+'”)'; }
function diff(a,b){ var A=words(a),B=words(b),n=A.length,m=B.length,W=m+1; var T=new Uint16Array((n+1)*W),i,j;

  var id = location.hash.replace('#',''); ui.form=null; ui.editing=ui.declining=ui.removing=null;
  if(id==='load' && sec.name){ ui.view='load'; D=null; render(); return; }
  if(/^D-/.test(id)) openDay(id); else openHome(); }
function act(body, msg){ ui.busy=true; render(); body.pin = sec.pin;
  return send(body).then(function(r){ ui.busy=false; if(!r.ok){ toast(r.error); return openDay(D.day.id, true); }
    ui.editing=ui.declining=null; toast(msg); return openDay(D.day.id, true); })
  .catch(function(){ ui.busy=false; render(); toast('Could not reach the server. Nothing was changed.'); }); }

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-tab],[data-filter],[data-jump],[data-propose],[data-act]'); if(!t) return;
  var d = t.dataset;
  if(d.act==='close-form'){ if(e.target===t){ ui.form=null; renderLayer(); } return; }
  if(d.tab){ ui.tab=d.tab; render(); window.scrollTo(0,0); return; }
  if(d.filter){ ui.filter=d.filter; render(); return; }
  if(d.jump){ if(ui.tab!=='minutes'){ ui.tab='minutes'; render(); } var el=$(d.jump); if(el) el.scrollIntoView({block:'start'}); return; }
  if(d.propose){ ui.form=d.propose; renderLayer(); var f=document.querySelector('#f-value,#f-text'); if(f) f.focus(); return; }
  switch(d.act){
    case 'close-form-btn': ui.form=null; renderLayer(); return;
    case 'signin': ui.form='signin'; renderLayer(); return;
    case 'signout': sec={pin:'',name:''}; try{sessionStorage.removeItem('mm-sec');}catch(x){} if(ui.view==='load') location.hash=''; else render(); return;
    case 'home': if(location.hash) location.hash=''; else route(); return;
    case 'retry': route(); return;
    case 'refresh': openDay(D.day.id, true).then(function(){ toast('Up to date.'); }); return;
    case 'load': ui.preview=null; ui.loadText=''; ui.loadTitle=''; location.hash='load'; return;
    case 'preview': { ui.loadTitle=$('l-title').value.trim(); ui.loadText=$('l-text').value; var bl=parseMinutes(ui.loadText);
      if(!bl.length){ $('l-err').textContent='Paste the minutes first.'; return; } ui.preview=bl; render(); return; }
    case 'publish': { ui.loadTitle=$('l-title').value.trim(); if(!ui.loadTitle){ $('l-err').textContent='Give the minutes a title, for example “Minutes of Day Three, 10 October 2026”.'; $('l-title').focus(); return; }
      ui.busy=true; render();
      send({action:'publish', pin:sec.pin, title:ui.loadTitle, blocks:ui.preview}).then(function(r){ ui.busy=false; if(!r.ok){ render(); toast(r.error); return; }
        ui.preview=null; ui.loadText=''; toast('Published. Share the usual link.'); location.hash=r.id; }).catch(function(){ ui.busy=false; render(); toast('Could not publish. Check your connection and try again.'); }); return; }
    case 'remove': ui.removing=d.id; render(); return;
    case 'remove-go': send({action:'removeDay', pin:sec.pin, dayId:d.id}).then(function(r){ ui.removing=null; toast(r.ok?'Removed.':r.error); openHome(); }).catch(function(){ toast('Could not reach the server.'); }); return;
    case 'accept': act({action:'decide', id:d.id, status:'accepted'}, 'Accepted. The minutes now carry this change.'); return;
    case 'edit': ui.editing=d.id; ui.declining=null; render(); return;
    case 'decline': ui.declining=d.id; ui.editing=null; render(); return;
    case 'cancel': ui.editing=ui.declining=ui.removing=null; render(); return;
    case 'accept-edit': { var val=$('fin').value.trim(); if(!val) return; act({action:'decide', id:d.id, status:'accepted', final:val}, 'Accepted with your wording.'); return; }
    case 'decline-go': act({action:'decide', id:d.id, status:'declined', note:$('why').value.trim()}, 'Declined. The minutes are unchanged.'); return;
    case 'reopen': act({action:'reopen', id:d.id}, 'Back in the queue.'); return;
    case 'copy': { var txt=scheduleText(), box=$('copybox');
      var fb=function(){ box.hidden=false; box.value=txt; box.focus(); box.select(); toast('Select the text and copy it.'); };
      try{ navigator.clipboard.writeText(txt).then(function(){ toast('Schedule copied.'); }, fb); }catch(x){ fb(); } return; }
  }
});
window.addEventListener('hashchange', route);
setInterval(function(){ if(sec.name && ui.view==='day' && D && !ui.form && !ui.editing && !ui.declining && !ui.busy && !document.hidden) openDay(D.day.id, true, true); }, 120000);
loadReports(); route();
</script>
</body>
